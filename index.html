<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jahidul Islam Jihad — Mariner & Photographer</title>
    <meta
      name="description"
      content="Portfolio of Jahidul Islam Jihad, a mariner by profession and monochrome fine-art photographer by passion."
    />
    <meta property="og:title" content="Jahidul Islam Jihad — Mariner & Photographer" />
    <meta
      property="og:description"
      content="Sailing through life, capturing its beauty. Explore monochrome maritime, horizon, and architectural photography by Jahidul Islam Jihad."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://i.ibb.co.com/HTzQfRQy/Picsart-26-11-14-22-21-08-763.jpg" />
    <meta property="og:image:alt" content="Monochrome portrait of Jahidul Islam Jihad" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://i.ibb.co.com/HTzQfRQy/Picsart-26-11-14-22-21-08-763.jpg" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="https://i.ibb.co.com/HTzQfRQy/Picsart-26-11-14-22-21-08-763.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body data-route="home" class="bg-[#080808] text-neutral-100 antialiased selection:bg-white selection:text-neutral-950">
    <!-- Ship's Wheel Preloader Overlay -->
    <div
      id="page-preloader"
      aria-label="Loading portfolio"
      class="preloader-overlay fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#080808]"
    >
      <svg
        viewBox="0 0 80 80"
        class="helm-wheel-spin w-16 h-16 text-neutral-200"
        fill="none"
        aria-hidden="true"
      >
        <circle cx="40" cy="40" r="22" stroke="currentColor" stroke-width="2" />
        <circle cx="40" cy="40" r="6" stroke="currentColor" stroke-width="1.8" />
        <line x1="40" y1="6" x2="40" y2="34" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="40" y1="46" x2="40" y2="74" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="6" y1="40" x2="34" y2="40" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="46" y1="40" x2="74" y2="40" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="16" y1="16" x2="35.7" y2="35.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="44.3" y1="44.3" x2="64" y2="64" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="64" y1="16" x2="44.3" y2="35.7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <line x1="35.7" y1="44.3" x2="16" y2="64" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        <circle cx="40" cy="6" r="2" fill="currentColor" />
        <circle cx="40" cy="74" r="2" fill="currentColor" />
        <circle cx="6" cy="40" r="2" fill="currentColor" />
        <circle cx="74" cy="40" r="2" fill="currentColor" />
        <circle cx="16" cy="16" r="2" fill="currentColor" />
        <circle cx="64" cy="64" r="2" fill="currentColor" />
        <circle cx="64" cy="16" r="2" fill="currentColor" />
        <circle cx="16" cy="64" r="2" fill="currentColor" />
      </svg>
      <p class="mt-4 font-serif italic text-xs tracking-[0.22em] text-neutral-400">
        Jahidul Islam Jihad
      </p>
    </div>

    <!-- Track preloader start time and fail-safe timer for broken network edges -->
    <script>
      window.__preloaderStart = Date.now();
      window.setTimeout(function () {
        var el = document.getElementById('page-preloader');
        if (el && !el.classList.contains('is-hidden')) {
          el.classList.add('is-hidden');
          el.setAttribute('aria-hidden', 'true');
        }
      }, 8500);
    </script>

    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:px-4 focus:py-2.5 focus:rounded-md focus:bg-white focus:text-neutral-950 focus:text-sm focus:font-medium focus:shadow-lg"
    >
      Skip to main content
    </a>

    <div id="spa-root"></div>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
